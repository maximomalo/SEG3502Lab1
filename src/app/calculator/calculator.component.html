<div>
  <label for="firstNumber">Premier nombre:</label>
  <input type="number" id="firstNumber" [(ngModel)]="firstNumber" (ngModelChange)="reset()">

  <br><br>

  <label for="secondNumber">Second nombre:</label>
  <input type="number" id="secondNumber" [(ngModel)]="secondNumber" (ngModelChange)="reset()">

  <br>
  <p>Résultat: {{ result }}</p>
  <button [class.active]="operation === '+'" (click)="calculate('+')">+</button>
  <button [class.active]="operation === '-'" (click)="calculate('-')">−</button>
  <button [class.active]="operation === '*'" (click)="calculate('*')">×</button>
  <button [class.active]="operation === '/'" (click)="calculate('/')">÷</button>

  
</div><p></p>
